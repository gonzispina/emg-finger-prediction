; Dos environments: el firmware integrado y un test standalone del ADS.
; Para alternar:
;   pio run -e main --target upload                     (firmware completo)
;   pio run -e test_ads --target upload                 (solo test del ADS1256)
;   pio device monitor -e test_ads                      (ver el test)

[common]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:main]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
build_src_filter = +<main.cpp>

[env:test_ads]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
build_src_filter = +<test_ads.cpp>
